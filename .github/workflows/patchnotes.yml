name: Patchnotes aktualisieren

on:
  schedule:
    - cron: "37 */3 * * *"   # alle drei Stunden; GitHub startet den Lauf je nach Auslastung später
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: patchnotes
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patchnotes abrufen (RSI Comm-Link und Spectrum)
        run: python3 tools/fetch_patchnotes.py patchnotes.json
      - name: Änderungen speichern
        run: |
          git add patchnotes.json
          if git diff --cached --quiet; then
            echo "Keine Änderungen"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Patchnotes aktualisiert"
          git pull --rebase
          git push
